name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Install, verify, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      POSTGRES_DB: financial_pods_test
      POSTGRES_USER: financial_pods_test
      POSTGRES_PASSWORD: ci-local-only
      DATABASE_URL: postgresql+psycopg://financial_pods_test:ci-local-only@127.0.0.1:5432/financial_pods_test
      REDIS_URL: redis://127.0.0.1:6379/0
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: financial_pods_test
          POSTGRES_USER: financial_pods_test
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial_pods_test -d financial_pods_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/requirements*.lock

      - name: Install dependencies
        run: node scripts/task.mjs setup

      - name: Enable and verify pgvector
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U financial_pods_test -d financial_pods_test \
            -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "SELECT extversion FROM pg_extension WHERE extname = 'vector';"

      - name: Validate Docker Compose model
        run: docker compose config --quiet

      - name: Verify immutable reference artifacts
        run: node scripts/task.mjs verify-artifacts

      - name: Lint
        run: node scripts/task.mjs lint

      - name: Check formatting
        run: node scripts/task.mjs format-check

      - name: Type-check
        run: node scripts/task.mjs typecheck

      - name: Run unit and integration tests
        run: node scripts/task.mjs test

      - name: Build applications
        run: node scripts/task.mjs build

      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Run browser smoke test
        run: node scripts/task.mjs e2e
